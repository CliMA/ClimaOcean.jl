agents:
  queue: central
  slurm_mem: 16G
  modules: climacommon/2026_02_18

timeout_in_minutes: 1440

env:
  OPENBLAS_NUM_THREADS: 1
  OMPI_MCA_opal_warn_on_missing_libcuda: 0
  JULIA_NUM_PRECOMPILE_TASKS: 8
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/default:"

steps:
  - label: "🏕️ initialize"
    key: "init"
    command:
      - "echo '--- Instantiate the test environment'"
      - "julia --project=test -e 'using Pkg; Pkg.instantiate(verbose=true)'"
      - "julia --project=test -e 'using Pkg; Pkg.precompile(strict=true); Pkg.status()'"
      - "julia --project=test -e 'using CUDA; CUDA.precompile_runtime()'"
    concurrency: 1
    concurrency_group: 'depot/climaocean-ci'
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8

  - wait

  - label: "🌦️ configurations, absolute salinity, total water and diagnostics"
    key: "unit_tests"
    command:
      - "julia --project=test test/test_configurations.jl"
      - "julia --project=test test/test_total_water_and_diagnostics.jl"
    agents:
      slurm_mem: 32G
      slurm_cpus_per_task: 8

  - label: "🌊 one-degree regression"
    key: "one_degree_regression"
    env:
      GPU_TEST: "true"
    command:
      - "julia --project=test test/test_one_degree_regression.jl"
    agents:
      slurm_mem: 64G
      slurm_gpus: 1
      slurm_cpus_per_task: 8

  - label: "📖 documentation"
    key: "docs"
    command:
      - "julia --project=docs -e 'using Pkg; Pkg.instantiate(verbose=true)'"
      - "julia --project=docs docs/make.jl"
    agents:
      slurm_mem: 32G
      slurm_cpus_per_task: 8
